[pytest]
asyncio_mode = auto
# One event loop for the whole session, not one per test. This is what lets
# `tests/conftest.py` open a single Mongo connection for the whole run instead
# of one per test — Motor's client is bound to the loop it was created on, so
# without this a shared client would break the first time a later test tried
# to use it from a different loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
