# Serving the built SPA, and proxying everything that is not it (#18).
#
# The two API locations come first so `/api/*` and `/ws/*` never fall into the
# SPA fallback: a mistyped API path must stay a 404 from the backend rather than
# returning `index.html` with a 200, which is the kind of thing a client only
# discovers by parsing HTML as JSON.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The retro board's socket (#12). Upgrade and Connection are what make it a
    # WebSocket rather than a request that closes; the long timeouts are what
    # keep it open through a quiet meeting.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client-side routing: /projects/example is the app's route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
